# Ansible 설정 — 디버그 콘솔 출력 / error·fail 확인에 최적화
# 사용 예:
#   ansible-playbook site.yml --check --diff        # dry-run (변경 없이 검증)
#   ansible-playbook site.yml -vvv                  # 상세 디버그 출력
#   ANSIBLE_STDOUT_CALLBACK=debug ansible-playbook site.yml   # 실패 원인 가독성↑

[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
forks                = 10

# 사람이 읽기 좋은 출력. 실패 task 의 입출력을 잘 보여줌.
# yaml: 평상시 가독성 / debug: 실패 진단용. 필요 시 환경변수로 전환.
stdout_callback      = yaml
bin_ansible_callbacks = True

# 실행 로그 파일로도 보존 (콘솔 + 파일 동시 확인)
log_path             = ./ansible-run.log

# task 별 시간 측정 → 느린/멈춘 지점 파악
callbacks_enabled    = profile_tasks, timer

[ssh_connection]
pipelining = True
