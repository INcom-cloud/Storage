---
# T2 단일 노드: PostgreSQL + FastAPI(uvicorn) 통합 배포 (Rocky/RHEL 9)

# ---------- PostgreSQL ----------
- name: "패키지 설치 (PostgreSQL, python3)"
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql
      - python3
      - python3-pip
    state: present

- name: "PostgreSQL 초기화 여부 확인"
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: pg_initialized

- name: "PostgreSQL initdb (최초 1회)"
  ansible.builtin.command: postgresql-setup --initdb
  when: not pg_initialized.stat.exists
  register: pg_initdb
  changed_when: pg_initdb.rc == 0
  failed_when: pg_initdb.rc != 0 and not pg_initialized.stat.exists

- name: "127.0.0.1 비밀번호 인증 허용 (pg_hba scram)"
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32'
    line: "host    all    all    127.0.0.1/32    scram-sha-256"
  notify: reload postgresql

- name: "PostgreSQL 서비스 기동"
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: "DB role 존재 확인"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ pg_user }}'"
  register: pg_role
  changed_when: false

- name: "DB role 생성"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -c "CREATE ROLE {{ pg_user }} LOGIN PASSWORD '{{ pg_password }}'"
  when: pg_role.stdout != "1"

- name: "데이터베이스 존재 확인"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ pg_db }}'"
  register: pg_dbq
  changed_when: false

- name: "데이터베이스 생성"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -c "CREATE DATABASE {{ pg_db }} OWNER {{ pg_user }}"
  when: pg_dbq.stdout != "1"

# ---------- FastAPI 앱 ----------
- name: "API 실행 전용 계정 생성"
  ansible.builtin.user:
    name: "{{ t2_run_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ t2_install_dir }}"

- name: "설치 디렉터리 생성"
  ansible.builtin.file:
    path: "{{ t2_install_dir }}"
    state: directory
    owner: "{{ t2_run_user }}"
    group: "{{ t2_run_user }}"
    mode: "0750"

- name: "앱 소스 전달 (start/t2-api/ → {{ t2_install_dir }})"
  ansible.builtin.copy:
    src: "{{ t2_src_local }}"
    dest: "{{ t2_install_dir }}/"
    owner: "{{ t2_run_user }}"
    group: "{{ t2_run_user }}"
    mode: "0640"
    directory_mode: "0750"
  notify: restart t2-api

- name: "venv + 의존성 설치 (online: PyPI)"
  ansible.builtin.pip:
    requirements: "{{ t2_install_dir }}/requirements.txt"
    virtualenv: "{{ t2_venv_dir }}"
    virtualenv_command: "python3 -m venv"
  become_user: "{{ t2_run_user }}"
  when: t2_pip_mode == "online"
  register: pip_online
  failed_when: pip_online.failed

- name: "venv + 의존성 설치 (offline: wheelhouse)"
  ansible.builtin.pip:
    requirements: "{{ t2_install_dir }}/requirements.txt"
    virtualenv: "{{ t2_venv_dir }}"
    virtualenv_command: "python3 -m venv"
    extra_args: "--no-index --find-links {{ t2_wheelhouse }}"
  become_user: "{{ t2_run_user }}"
  when: t2_pip_mode == "offline"

- name: "systemd unit 배포"
  ansible.builtin.template:
    src: t2-api.service.j2
    dest: "/etc/systemd/system/t2-api.service"
    mode: "0644"
  notify: restart t2-api

- name: "API 서비스 활성화/기동"
  ansible.builtin.systemd:
    name: t2-api.service
    enabled: true
    state: started
    daemon_reload: true
  register: t2svc
  failed_when: t2svc.failed

- name: "API 헬스체크 (200 아니면 fail)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ t2_bind_port }}/health"
    status_code: 200
  register: health
  retries: 5
  delay: 3
  until: health.status == 200
