# 인벤토리 — T1(Public 노드) / T2(DB+API 서버)
# 실제 IP/호스트로 교체하세요. ansible_user 는 sudo 가능한 계정.

[t1]
t1-public-01 ansible_host=10.0.1.10

[t2]
t2-api-db-01 ansible_host=10.0.2.10

[all:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
# 로컬 테스트용(컨테이너/VM 없이 문법만 검증) 예:
#   ansible-playbook site.yml --connection=local --check --diff -vvv
